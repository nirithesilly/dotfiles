# Прозрачность
background_opacity 0.85

# Убираем рамки и заголовок окна
hide_window_decorations yes

# Шрифт
font_family JetBrainsMono Nerd Font
font_size 11

# Цветные эмодзи
symbol_map U+2600-U+27BF,U+2B00-U+2BFF,U+1F000-U+1FAFF Noto Color Emoji

# Курсор
cursor_shape block
cursor_blink_interval 0

# Сплиты: layout "splits" обязателен, иначе --location=vsplit игнорируется
enabled_layouts splits

# Сплит по Ctrl+Shift+Enter — новое окно справа (слева/справа)
map ctrl+shift+enter launch --location=vsplit --cwd=current

# Убираем задержку при старте
repaint_delay 10
input_delay 3
sync_to_monitor yes
